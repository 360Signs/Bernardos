  const up=e=>{if(!this.pointers.has(e.pointerId))return;const r=this.el.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};this.pointers.delete(e.pointerId);if(this.pointers.size<2)this.pinchDist=0;if(this.pointers.size===0){this.el.classList.remove('dragging');if(!this.dragged){const s=this.hitStore(p.x,p.y);s?this.openPopup(s):this.closePopup()}}};this.el.addEventListener('pointerup',up);this.el.addEventListener('pointercancel',up)}
}
let map;
function redraw(){map.renderOverlay();map.positionPopup();renderRouteList()}
function fitVisible(){map.fitStores(visibleStores(),9)}
function setRegion(r){activeRegion=r;renderRegionControls();redraw();fitVisible()}
function renderRegionControls(){const regs=['All','Scotland','North','Midlands','South'];document.querySelectorAll('[data-region-container]').forEach(c=>{c.innerHTML='';regs.forEach(r=>{const b=document.createElement('button');b.className=(c.dataset.kind||'chip')+(r===activeRegion?' active':'');b.textContent=r;b.onclick=()=>setRegion(r);c.appendChild(b)})})}
function renderSizeFilters(){const c=document.getElementById('sizeFilters');if(!c)return;c.innerHTML='';['S','M','L','XL'].forEach(sz=>{const b=document.createElement('button');b.className='chip'+(activeSizes.has(sz)?' active':'');b.style.borderColor=COLORS[sz];b.textContent=`${sz} ${sizeText(sz)}`;b.onclick=()=>{activeSizes.has(sz)?activeSizes.delete(sz):activeSizes.add(sz);renderSizeFilters();redraw();fitVisible()};c.appendChild(b)})}
function renderRouteList(){const c=document.getElementById('routeList');if(!c)return;c.innerHTML='';const regions=activeRegion==='All'?['Scotland','North','Midlands','South']:[activeRegion];for(const region of regions){const t=document.createElement('div');t.className='route-title';t.style.color=REGION_COLORS[region];t.textContent=region;c.appendChild(t);routeOrder[region].forEach((name,i)=>{const s=stores.find(x=>x.name===name);if(!s||!activeSizes.has(s.size))return;const b=document.createElement('button');b.className='route-item';b.innerHTML=`<span class="num">${i+1}</span><span class="route-name"><b>${esc(s.name)}</b><small>${s.qty>1?'Qty '+s.qty+' • ':''}${s.region}</small></span><span class="size-badge" style="background:${COLORS[s.size]}">${s.size}</span>`;b.onclick=()=>{map.setView(s.lat,s.lng,11);map.openPopup(s);if(window.closePanel)window.closePanel()};c.appendChild(b)})}}
function resetAll(){activeRegion='All';activeSizes=new Set(['S','M','L','XL']);renderRegionControls();renderSizeFilters();redraw();fitVisible()}
function init(){map=new SlippyMap(document.getElementById('map'));renderRegionControls();renderSizeFilters();renderRouteList();fitVisible();document.getElementById('zoomIn').onclick=()=>map.zoomInAtCenter();document.getElementById('zoomOut').onclick=()=>map.zoomOutAtCenter();}

const panel=document.getElementById('panel');window.closePanel=()=>panel.classList.remove('open');document.getElementById('panelBtn').onclick=()=>panel.classList.add('open');document.getElementById('closePanel').onclick=window.closePanel;init();</script></body></html>
