class SlippyMap{
 constructor(el){
  this.el=el;
  this.zoom=6;
  this.center={lat:54.4,lng:-2.7};
  this.minZoom=4;
  this.maxZoom=19;
  this.tiles=new Map();
  this.pointers=new Map();
  this.dragStart=null;
  this.dragged=false;
  this.pinchDist=0;
  this.popupStore=null;
  this.renderRaf=0;
  this.zoomAnim=0;
  this.tileLayer=document.createElement('div');
  this.tileLayer.className='tile-layer';
  this.canvas=document.createElement('canvas');
  this.canvas.className='overlay';
  this.popup=document.createElement('div');
  this.popup.className='map-popup';
  this.el.append(this.tileLayer,this.canvas,this.popup);
  this.ctx=this.canvas.getContext('2d',{alpha:true});
  this.bind();
  if('ResizeObserver' in window)new ResizeObserver(()=>this.resize()).observe(this.el);
  else window.addEventListener('resize',()=>this.resize());
  this.resize();
 }

 worldSize(z=this.zoom){return 256*Math.pow(2,z)}

 llToWorld(lat,lng,z=this.zoom){
  lat=Math.max(-85.05112878,Math.min(85.05112878,lat));
  const n=this.worldSize(z);
  const x=(lng+180)/360*n;
  const sin=Math.sin(lat*Math.PI/180);
  const y=(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n;
  return{x,y};
 }

 worldToLL(x,y,z=this.zoom){
  const n=this.worldSize(z);
  const lng=x/n*360-180;
  const yy=.5-y/n;
  const lat=90-360*Math.atan(Math.exp(-yy*2*Math.PI))/Math.PI;
  return{lat,lng};
 }

 centerWorld(z=this.zoom){return this.llToWorld(this.center.lat,this.center.lng,z)}

 setCenterWorld(x,y,z=this.zoom){
  const n=this.worldSize(z);
  x=Math.max(0,Math.min(n,x));
  y=Math.max(0,Math.min(n,y));
  this.center=this.worldToLL(x,y,z);
 }

 screenPoint(lat,lng){
  const p=this.llToWorld(lat,lng,this.zoom);
  const c=this.centerWorld(this.zoom);
  return{x:p.x-c.x+this.el.clientWidth/2,y:p.y-c.y+this.el.clientHeight/2};
 }

 resize(){
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  const w=this.el.clientWidth,h=this.el.clientHeight;
  if(!w||!h)return;
  this.canvas.width=Math.round(w*dpr);
  this.canvas.height=Math.round(h*dpr);
  this.canvas.style.width=w+'px';
  this.canvas.style.height=h+'px';
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.render();
 }

 scheduleRender(){
  if(this.renderRaf)return;
  this.renderRaf=requestAnimationFrame(()=>{
   this.renderRaf=0;
   this.render();
  });
 }

 render(){
  this.renderTiles();
  this.renderOverlay();
  this.positionPopup();
 }

 tileView(z,margin=1){
  const w=this.el.clientWidth,h=this.el.clientHeight;
  const scale=Math.pow(2,this.zoom-z);
  const c=this.centerWorld(z);
  const viewW=w/scale,viewH=h/scale;
  const left=c.x-viewW/2,top=c.y-viewH/2;
  const n=Math.pow(2,z);
  return{
   n,left,top,scale,
   x0:Math.floor(left/256)-margin,
   x1:Math.floor((left+viewW)/256)+margin,
   y0:Math.max(0,Math.floor(top/256)-margin),
   y1:Math.min(n-1,Math.floor((top+viewH)/256)+margin)
  };
 }

 renderTileZoom(z,zIndex,used){
  const b=this.tileView(z,1);
  for(let ty=b.y0;ty<=b.y1;ty++){
   for(let tx=b.x0;tx<=b.x1;tx++){
    const wx=((tx%b.n)+b.n)%b.n;
    const key=`${z}/${wx}/${ty}`;
    used.add(key);

    let img=this.tiles.get(key);
    if(!img){
     img=document.createElement('img');
     img.className='tile';
     img.alt='';
     img.draggable=false;
     img.decoding='async';
     img.loading='eager';
     img.onload=()=>img.classList.add('ready');
     img.onerror=()=>img.classList.add('ready');
     img.src=`https://tile.openstreetmap.org/${z}/${wx}/${ty}.png`;
     if(img.complete)img.classList.add('ready');
     this.tiles.set(key,img);
     this.tileLayer.appendChild(img);
    }

    const x=(tx*256-b.left)*b.scale;
    const y=(ty*256-b.top)*b.scale;
    img.style.zIndex=String(zIndex);
    img.style.display='block';
    img.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) scale(${b.scale.toFixed(6)})`;
   }
  }
 }

 renderTiles(){
  const w=this.el.clientWidth,h=this.el.clientHeight;
  if(!w||!h)return;

  const low=Math.max(this.minZoom,Math.min(this.maxZoom,Math.floor(this.zoom)));
  const high=Math.max(this.minZoom,Math.min(this.maxZoom,Math.ceil(this.zoom)));
  const used=new Set();

  this.renderTileZoom(low,1,used);
  if(high!==low)this.renderTileZoom(high,2,used);

  for(const [key,img] of this.tiles){
   if(!used.has(key)){
    img.remove();
    this.tiles.delete(key);
   }
  }
 }

 renderOverlay(){
  const ctx=this.ctx,w=this.el.clientWidth,h=this.el.clientHeight;
  ctx.clearRect(0,0,w,h);
  const regions=activeRegion==='All'?['Scotland','North','Midlands','South']:[activeRegion];
  ctx.lineCap='round';
  ctx.lineJoin='round';

  for(const region of regions){
   const ordered=routeOrder[region]
    .map(n=>stores.find(s=>s.name===n))
    .filter(s=>s&&activeSizes.has(s.size));
   if(ordered.length>1){
    ctx.beginPath();
    ordered.forEach((s,i)=>{
     const p=this.screenPoint(s.lat,s.lng);
     i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
    });
    ctx.strokeStyle=REGION_COLORS[region];
    ctx.globalAlpha=.85;
    ctx.lineWidth=5;
    ctx.stroke();
    ctx.globalAlpha=1;
   }
  }

  for(const s of visibleStores()){
   const p=this.screenPoint(s.lat,s.lng);
   if(p.x<-40||p.x>w+40||p.y<-40||p.y>h+40)continue;
   ctx.beginPath();
   ctx.arc(p.x,p.y,17,0,Math.PI*2);
   ctx.fillStyle=COLORS[s.size];
   ctx.fill();
   ctx.lineWidth=3;
   ctx.strokeStyle='#fff';
   ctx.stroke();
   ctx.fillStyle='#0b1220';
   ctx.font='900 13px Segoe UI,Arial';
   ctx.textAlign='center';
   ctx.textBaseline='middle';
   ctx.fillText(String(routeNoFor(s)),p.x,p.y);
  }
 }

 positionPopup(){
  if(!this.popupStore)return;
  const p=this.screenPoint(this.popupStore.lat,this.popupStore.lng);
  this.popup.style.left=p.x+'px';
  this.popup.style.top=p.y+'px';
 }

 openPopup(s){
  this.popupStore=s;
  const coords=`${s.lat.toFixed(7)}, ${s.lng.toFixed(7)}`;
  this.popup.innerHTML=`<button class="popup-close" aria-label="Close">×</button>
   <div class="popup-title">${esc(s.name)}</div>
   <div class="popup-sub">${s.region} • Stop ${routeNoFor(s)} • Store ${esc(s.storeNo)}</div>
   <div class="popup-row"><b>${esc(s.shopType)}</b></div>
   <div class="popup-row"><b>Address:</b> ${esc(s.address)}</div>
   <div class="popup-row"><b>Vinyl:</b> ${s.size==='TBC'?'TBC':`${s.size} (${sizeText(s.size)})`}</div>
   <div class="popup-row"><b>Coordinates:</b> ${coords}</div>
   <div class="popup-row" style="margin-top:8px">
    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.lat+','+s.lng)}" target="_blank" rel="noopener" style="font-weight:800;color:#2563eb">Open exact pin ↗</a>
   </div>`;
  this.popup.querySelector('.popup-close').onclick=()=>this.closePopup();
  this.popup.classList.add('open');
  this.positionPopup();
 }

 closePopup(){
  this.popupStore=null;
  this.popup.classList.remove('open');
 }

 hitStore(x,y){
  let best=null,bd=25*25;
  for(const s of visibleStores()){
   const p=this.screenPoint(s.lat,s.lng);
   const d=(p.x-x)**2+(p.y-y)**2;
   if(d<bd){bd=d;best=s}
  }
  return best;
 }

 setView(lat,lng,zoom=this.zoom){
  cancelAnimationFrame(this.zoomAnim);
  this.zoomAnim=0;
  this.center={lat,lng};
  this.zoom=Math.max(this.minZoom,Math.min(this.maxZoom,Number(zoom)));
  this.closePopup();
  this.render();
 }

 zoomAt(x,y,newZoom){
  newZoom=Math.max(this.minZoom,Math.min(this.maxZoom,Number(newZoom)));
  if(!Number.isFinite(newZoom)||Math.abs(newZoom-this.zoom)<0.00001)return;

  const oldZoom=this.zoom;
  const oldC=this.centerWorld(oldZoom);
  const oldWorld={
   x:oldC.x+(x-this.el.clientWidth/2),
   y:oldC.y+(y-this.el.clientHeight/2)
  };
  const anchor=this.worldToLL(oldWorld.x,oldWorld.y,oldZoom);

  this.zoom=newZoom;
  const target=this.llToWorld(anchor.lat,anchor.lng,newZoom);
  this.setCenterWorld(
   target.x-(x-this.el.clientWidth/2),
   target.y-(y-this.el.clientHeight/2),
   newZoom
  );
  this.scheduleRender();
 }

 animateZoomAt(x,y,targetZoom,duration=190){
  cancelAnimationFrame(this.zoomAnim);
  targetZoom=Math.max(this.minZoom,Math.min(this.maxZoom,targetZoom));
  const startZoom=this.zoom;
  const change=targetZoom-startZoom;
  if(Math.abs(change)<.001)return;

  const start=performance.now();
  const frame=now=>{
   const t=Math.min(1,(now-start)/duration);
   const eased=1-Math.pow(1-t,3);
   this.zoomAt(x,y,startZoom+change*eased);
   if(t<1)this.zoomAnim=requestAnimationFrame(frame);
   else this.zoomAnim=0;
  };
  this.zoomAnim=requestAnimationFrame(frame);
 }

 zoomInAtCenter(){
  const target=Math.min(this.maxZoom,Math.floor(this.zoom+.001)+1);
  this.animateZoomAt(this.el.clientWidth/2,this.el.clientHeight/2,target);
 }

 zoomOutAtCenter(){
  const target=Math.max(this.minZoom,Math.ceil(this.zoom-.001)-1);
  this.animateZoomAt(this.el.clientWidth/2,this.el.clientHeight/2,target);
 }

 fitStores(arr,maxZoom=9){
  if(!arr.length)return;
  cancelAnimationFrame(this.zoomAnim);
  this.zoomAnim=0;

  const pad=Math.min(90,Math.max(45,Math.min(this.el.clientWidth,this.el.clientHeight)*.12));
  const availW=Math.max(100,this.el.clientWidth-pad*2);
  const availH=Math.max(100,this.el.clientHeight-pad*2);
  let chosen=this.minZoom,centerWorld=null;

  for(let z=Math.min(this.maxZoom,maxZoom);z>=this.minZoom;z--){
   const pts=arr.map(s=>this.llToWorld(s.lat,s.lng,z));
   const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
   const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
   if(maxX-minX<=availW&&maxY-minY<=availH){
    chosen=z;
    centerWorld={x:(minX+maxX)/2,y:(minY+maxY)/2};
    break;
   }
  }

  this.zoom=chosen;
  if(!centerWorld){
   const pts=arr.map(s=>this.llToWorld(s.lat,s.lng,chosen));
   centerWorld={
    x:(Math.min(...pts.map(p=>p.x))+Math.max(...pts.map(p=>p.x)))/2,
    y:(Math.min(...pts.map(p=>p.y))+Math.max(...pts.map(p=>p.y)))/2
   };
  }
  this.center=this.worldToLL(centerWorld.x,centerWorld.y,chosen);
  this.closePopup();
  this.render();
 }

 bind(){
  this.el.addEventListener('contextmenu',e=>e.preventDefault());

  this.el.addEventListener('wheel',e=>{
   e.preventDefault();
   cancelAnimationFrame(this.zoomAnim);
   this.zoomAnim=0;
   const r=this.el.getBoundingClientRect();
   let delta=e.deltaY;
   if(e.deltaMode===1)delta*=16;
   else if(e.deltaMode===2)delta*=Math.max(500,this.el.clientHeight);
   const amount=Math.max(.015,Math.min(.28,Math.abs(delta)*.0024));
   this.zoomAt(
    e.clientX-r.left,
    e.clientY-r.top,
    this.zoom+(delta<0?amount:-amount)
   );
  },{passive:false});

  this.el.addEventListener('dblclick',e=>{
   e.preventDefault();
   const r=this.el.getBoundingClientRect();
   this.animateZoomAt(e.clientX-r.left,e.clientY-r.top,this.zoom+1,190);
  });

  this.el.addEventListener('pointerdown',e=>{
   cancelAnimationFrame(this.zoomAnim);
   this.zoomAnim=0;
   this.el.setPointerCapture?.(e.pointerId);
   const r=this.el.getBoundingClientRect();
   const p={x:e.clientX-r.left,y:e.clientY-r.top};
   this.pointers.set(e.pointerId,p);
   this.dragStart=p;
   this.dragged=false;
   this.el.classList.add('dragging');
   if(this.pointers.size===2){
    const a=[...this.pointers.values()];
    this.pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
   }
  });

  this.el.addEventListener('pointermove',e=>{
   if(!this.pointers.has(e.pointerId))return;
   const r=this.el.getBoundingClientRect();
   const np={x:e.clientX-r.left,y:e.clientY-r.top};
   const op=this.pointers.get(e.pointerId);
   this.pointers.set(e.pointerId,np);

   if(this.pointers.size===1){
    const dx=np.x-op.x,dy=np.y-op.y;
    if(Math.abs(dx)+Math.abs(dy)>0){
     const c=this.centerWorld(this.zoom);
     this.setCenterWorld(c.x-dx,c.y-dy,this.zoom);
     if(this.dragStart&&Math.hypot(np.x-this.dragStart.x,np.y-this.dragStart.y)>4)this.dragged=true;
     this.scheduleRender();
    }
   }else if(this.pointers.size===2){
    const a=[...this.pointers.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(this.pinchDist>0&&d>0){
     const dz=Math.log2(d/this.pinchDist);
     if(Math.abs(dz)>.001)this.zoomAt(mid.x,mid.y,this.zoom+dz);
    }
    this.pinchDist=d;
    this.dragged=true;
   }
  });

  const up=e=>{
   if(!this.pointers.has(e.pointerId))return;
   const r=this.el.getBoundingClientRect();
   const p={x:e.clientX-r.left,y:e.clientY-r.top};
   this.pointers.delete(e.pointerId);
   if(this.pointers.size<2)this.pinchDist=0;
   if(this.pointers.size===0){
    this.el.classList.remove('dragging');
    if(!this.dragged){
     const s=this.hitStore(p.x,p.y);
     s?this.openPopup(s):this.closePopup();
    }
   }
  };
  this.el.addEventListener('pointerup',up);
  this.el.addEventListener('pointercancel',up);
 }
}
let map;
function redraw(){map.renderOverlay();map.positionPopup();renderRouteList()}
function fitVisible(){map.fitStores(visibleStores(),9)}
function setRegion(r){activeRegion=r;renderRegionControls();redraw();fitVisible()}
function renderRegionControls(){const regs=['All','Scotland','North','Midlands','South'];document.querySelectorAll('[data-region-container]').forEach(c=>{c.innerHTML='';regs.forEach(r=>{const b=document.createElement('button');b.className=(c.dataset.kind||'chip')+(r===activeRegion?' active':'');b.textContent=r;b.onclick=()=>setRegion(r);c.appendChild(b)})})}
function renderSizeFilters(){const c=document.getElementById('sizeFilters');if(!c)return;c.innerHTML='';['S','M','L','XL','TBC'].forEach(sz=>{const b=document.createElement('button');b.className='chip'+(activeSizes.has(sz)?' active':'');b.style.borderColor=COLORS[sz];b.textContent=`${sz} ${sizeText(sz)}`;b.onclick=()=>{activeSizes.has(sz)?activeSizes.delete(sz):activeSizes.add(sz);renderSizeFilters();redraw();fitVisible()};c.appendChild(b)})}
function renderRouteList(){const c=document.getElementById('routeList');if(!c)return;c.innerHTML='';const regions=activeRegion==='All'?['Scotland','North','Midlands','South']:[activeRegion];for(const region of regions){const t=document.createElement('div');t.className='route-title';t.style.color=REGION_COLORS[region];t.textContent=region;c.appendChild(t);routeOrder[region].forEach((name,i)=>{const s=stores.find(x=>x.name===name);if(!s||!activeSizes.has(s.size))return;const b=document.createElement('button');b.className='route-item';b.innerHTML=`<span class="num">${i+1}</span><span class="route-name"><b>${esc(s.name)}</b><small>Store ${esc(s.storeNo)} • ${esc(s.postcode)}</small></span><span class="size-badge" style="background:${COLORS[s.size]}">${s.size}</span>`;b.onclick=()=>{map.setView(s.lat,s.lng,17);map.openPopup(s);if(window.closePanel)window.closePanel()};c.appendChild(b)})}}
function resetAll(){activeRegion='All';activeSizes=new Set(['S','M','L','XL','TBC']);renderRegionControls();renderSizeFilters();redraw();fitVisible()}
function init(){map=new SlippyMap(document.getElementById('map'));renderRegionControls();renderSizeFilters();renderRouteList();fitVisible();document.getElementById('zoomIn').onclick=()=>map.zoomInAtCenter();document.getElementById('zoomOut').onclick=()=>map.zoomOutAtCenter();}

const panel=document.getElementById('panel');window.closePanel=()=>panel.classList.remove('open');document.getElementById('panelBtn').onclick=()=>panel.classList.add('open');document.getElementById('closePanel').onclick=window.closePanel;init();</script></body></html>
