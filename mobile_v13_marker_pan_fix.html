<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Barnardo's Vinyl Route Map - Mobile</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>

:root{
  --navy:#0b1220;
  --panel:#111827;
  --panel2:#1f2937;
  --border:#334155;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --accent:#2563eb;
  --large:#ef4444;
  --standard:#38bdf8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0b1220;color:#fff}
button{font:inherit}
#map{position:absolute;inset:0;background:#cfe5f5}
.maplibregl-map{position:relative;overflow:hidden}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-marker{position:absolute;left:0;top:0;will-change:transform;transition:none!important}
.maplibregl-popup-content{font-family:Segoe UI,Arial,sans-serif;border-radius:12px;padding:14px 16px;box-shadow:0 7px 24px rgba(0,0,0,.28)}
.maplibregl-popup-close-button{font-size:20px;padding:4px 8px;color:#334155}
.popup-title{font-weight:900;color:#0f172a;font-size:15px;padding-right:12px}
.popup-meta{color:#64748b;font-size:11px;margin:2px 0 7px}
.popup-priority{display:inline-block;background:#fee2e2;color:#991b1b;font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;margin:0 0 7px}
.popup-row{font-size:12px;color:#334155;margin:4px 0;line-height:1.35}
.popup-link{display:inline-block;margin-top:7px;font-size:12px;font-weight:900;color:#2563eb;text-decoration:none}
.store-marker{
  width:34px;height:34px;border-radius:50%;
  border:3px solid #fff;background:var(--marker-color);
  color:#0b1220;display:grid;place-items:center;
  font-size:12px;font-weight:950;
  box-shadow:0 3px 10px rgba(15,23,42,.4);
  cursor:pointer;padding:0;
  transition:box-shadow .12s ease,filter .12s ease;
}
.store-marker:hover{filter:brightness(1.08);box-shadow:0 4px 13px rgba(15,23,42,.48)}
.store-marker.editable{
  cursor:grab;
  box-shadow:0 0 0 4px rgba(255,255,255,.45),0 4px 16px rgba(0,0,0,.45);
  animation:editPulse 1.3s ease-in-out infinite alternate;
}
.store-marker.dragging{cursor:grabbing!important;animation:none;filter:brightness(1.12);box-shadow:0 0 0 5px rgba(255,255,255,.5),0 5px 18px rgba(0,0,0,.5)}
@keyframes editPulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.filter-btn,.group-btn{
  border:1px solid #334155;background:rgba(15,23,42,.94);color:#fff;
  border-radius:9px;padding:9px 11px;font-weight:850;cursor:pointer;
}
.filter-btn.active{background:#2563eb;border-color:#3b82f6}
.group-btn{display:inline-flex;align-items:center;gap:7px}
.group-btn.active{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.group-btn:not(.active){opacity:.48}
.group-dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;display:inline-block}
.route-heading{display:flex;align-items:center;gap:8px;font-weight:900;margin:14px 0 7px}
.route-heading span{width:10px;height:10px;border-radius:50%}
.route-item{
  width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;
  text-align:left;background:#1f2937;color:#fff;border:1px solid transparent;
  padding:10px;border-radius:10px;margin-bottom:7px;cursor:pointer;
}
.route-item:hover{border-color:#475569;background:#253145}
.route-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#334155;font-weight:900}
.route-copy{min-width:0}
.route-copy strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.route-copy small{display:block;color:#cbd5e1;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-badge{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;color:#0f172a}
.route-badge.large{background:#ef4444;color:#fff}
.route-badge.standard{background:#38bdf8}
.editor-bar{
  position:absolute;z-index:50;display:none;align-items:center;gap:7px;flex-wrap:wrap;
  background:rgba(127,29,29,.96);border:1px solid #fca5a5;
  box-shadow:0 6px 24px rgba(0,0,0,.35);border-radius:12px;padding:9px;
}
.editor-bar.show{display:flex}
.editor-title{font-size:12px;font-weight:950;margin-right:3px}
.editor-btn{border:1px solid rgba(255,255,255,.25);background:#fff;color:#7f1d1d;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer}
#editMessage{font-size:11px;color:#fecaca;min-width:120px}

html,body{overflow:hidden}
#app{height:100dvh;min-height:100vh;position:relative}
#map{position:absolute;inset:0}
.topbar{
  position:absolute;z-index:8;top:max(9px,env(safe-area-inset-top));left:9px;right:9px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none
}
.mobile-regions{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;max-width:calc(100vw - 118px)}
.mobile-regions::-webkit-scrollbar{display:none}
.panel-open{pointer-events:auto;border:0;background:#fff;color:#0f172a;border-radius:9px;padding:9px 10px;font-weight:900;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mobile-note{position:absolute;z-index:7;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));background:rgba(15,23,42,.9);color:#cbd5e1;border-radius:8px;padding:7px 9px;font-size:10px;pointer-events:none}
#panel{position:absolute;z-index:30;inset:0;background:#0f172a;display:none;overflow:auto;padding:max(13px,env(safe-area-inset-top)) 13px max(25px,env(safe-area-inset-bottom))}
#panel.open{display:block}
.panel-head{position:sticky;top:0;z-index:2;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:3px 0 11px}
.panel-head h1{font-size:19px;margin:0}
.close-panel{border:1px solid #334155;background:#1f2937;color:#fff;border-radius:9px;padding:9px 10px;font-weight:900}
.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:11px}
.card h2{font-size:13px;margin:0 0 9px}.controls{display:flex;gap:7px;flex-wrap:wrap}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;background:#1f2937;padding:9px;border-radius:9px;font-size:11px}
.legend-dot{width:13px;height:13px;border-radius:50%;border:2px solid white}
.editor-bar{left:9px;right:9px;bottom:max(54px,calc(env(safe-area-inset-bottom) + 54px))}
.maplibregl-ctrl-bottom-right{bottom:42px}


/* Keep DOM markers locked to the map during pan/zoom.
   MapLibre owns the marker element's transform; visual effects must not animate it. */
.maplibregl-marker.store-marker,
.store-marker.maplibregl-marker{
  transition:box-shadow .12s ease,filter .12s ease!important;
}

</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <div class="topbar">
    <div class="mobile-regions" data-region-controls></div>
    <button class="panel-open" id="openPanel" type="button">Key & Routes</button>
  </div>

  <div class="mobile-note">31 current stores • Large = priority • tap a numbered pin for store details</div>

  <section id="panel">
    <div class="panel-head">
      <h1>Barnardo's Routes</h1>
      <button class="close-panel" id="closePanel" type="button">Back to Map</button>
    </div>
    <section class="card">
      <h2>Store group</h2>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span><div><b>Large</b><br>priority stores</div></div>
        <div class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span><div><b>Standard</b><br>standard stores</div></div>
      </div>
    </section>
    <section class="card">
      <h2>Filter by group</h2>
      <div class="controls" data-group-controls></div>
    </section>
    <section class="card">
      <h2>Contractor region</h2>
      <div class="controls" data-region-controls></div>
    </section>
    <section class="card">
      <h2>Suggested route <span style="color:#94a3b8;font-weight:500">(<span data-store-count>31</span> shown)</span></h2>
      <div id="routeList"></div>
    </section>
  </section>

  <div class="editor-bar" id="editorBar">
    <span class="editor-title">PIN EDIT MODE</span>
    <button class="editor-btn" id="editExport" type="button">Export</button>
    <button class="editor-btn" id="editImportBtn" type="button">Import</button>
    <button class="editor-btn" id="editReset" type="button">Reset</button>
    <button class="editor-btn" id="editExit" type="button">Exit (@)</button>
    <input id="editImport" type="file" accept=".json,application/json" hidden>
    <span id="editMessage"></span>
  </div>
</div>

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function routeStop(store){
  const route = ROUTE_ORDER[store.region] || [];
  const i = route.indexOf(store.storeNo);
  return i >= 0 ? i + 1 : '';
}

function getStore(storeNo){
  return STORES.find(s => s.storeNo === storeNo);
}

function visibleStore(store){
  return (activeRegion === 'All' || store.region === activeRegion) && activeGroups.has(store.group);
}

function loadOverrides(){
  try{
    const saved = JSON.parse(localStorage.getItem(EDIT_STORAGE_KEY) || '{}');
    for(const store of STORES){
      const p = saved[store.storeNo];
      if(p && Number.isFinite(+p.lat) && Number.isFinite(+p.lng)){
        store.lat = +p.lat;
        store.lng = +p.lng;
      }
    }
  }catch(_){}
}

function saveOverride(store){
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(EDIT_STORAGE_KEY) || '{}') || {}; }catch(_){}

  localStorage.setItem(EDIT_STORAGE_KEY, JSON.stringify(saved));
}

  const out = {};
  for(const store of STORES){
    if(Math.abs(store.lat-store.baseLat) > 1e-9 || Math.abs(store.lng-store.baseLng) > 1e-9){
      out[store.storeNo] = {lat:store.lat, lng:store.lng};
    }
  }
  return out;
}

function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportEdits(){
  const data = {
    generatedAt:new Date().toISOString(),
    note:'Barnardos map pin corrections. Import through @ edit mode.',
    overrides:getOverrides()
  };
  downloadJSON('barnardos-pin-corrections.json', data);
}

function importEdits(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(String(reader.result || '{}'));
      const overrides = parsed.overrides || parsed;
      let changed = 0;
      for(const [storeNo,p] of Object.entries(overrides)){
        const s = getStore(storeNo);
        if(!s || !p || !Number.isFinite(+p.lat) || !Number.isFinite(+p.lng)) continue;
        s.lat = +p.lat;
        s.lng = +p.lng;
        const marker = markerByStore.get(storeNo);
        if(marker) marker.setLngLat([s.lng,s.lat]);
        saveOverride(s);
        changed++;
      }
      refreshAllRoutes(true);
      fitVisible(false);
      setEditMessage(changed ? `${changed} correction${changed===1?'':'s'} imported.` : 'No matching corrections found.');
    }catch(_){
      setEditMessage('Could not read that correction file.');
    }
    document.getElementById('editImport').value = '';
  };
  reader.readAsText(file);
}

function resetEdits(){
  if(!confirm('Reset every dragged pin back to the supplied coordinates?')) return;
  localStorage.removeItem(EDIT_STORAGE_KEY);
  for(const s of STORES){
    s.lat = s.baseLat;
    s.lng = s.baseLng;
    const marker = markerByStore.get(s.storeNo);
    if(marker) marker.setLngLat([s.lng,s.lat]);
  }
  refreshAllRoutes(true);
  fitVisible(false);
  setEditMessage('All pin corrections reset.');
}

function setEditMessage(text){
  const el = document.getElementById('editMessage');
  if(!el) return;
  el.textContent = text;
  if(text){
    clearTimeout(setEditMessage._t);
    setEditMessage._t = setTimeout(()=>{ if(el) el.textContent=''; }, 4000);
  }
}

function popupHTML(store){
  const priority = store.group === 'Large' ? '<span class="popup-priority">Priority: Large</span>' : '';
  return `
    <div class="popup-title">${esc(store.name)}</div>
    <div class="popup-meta">${esc(store.region)} • Stop ${routeStop(store)} • Store ${esc(store.storeNo)}</div>
    ${priority}
    <div class="popup-row"><b>${esc(store.shopType)}</b></div>
    <div class="popup-row"><b>Address:</b> ${esc(store.address)}</div>
    <div class="popup-row"><b>Group:</b> ${esc(store.group)}</div>
    <div class="popup-row"><b>Coordinates:</b> ${store.lat.toFixed(7)}, ${store.lng.toFixed(7)}</div>
    <a class="popup-link" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.lat+','+store.lng)}">
       Open exact pin ↗
    </a>
  `;
}

function openStore(store, zoom=17){
  selectedStoreNo = store.storeNo;
  map.easeTo({
    center:[store.lng,store.lat],
    zoom:Math.max(map.getZoom(),zoom),
    duration:650,
    essential:true
  });
  new maplibregl.Popup({offset:24, closeButton:true, maxWidth:'310px'})
    .setLngLat([store.lng,store.lat])
    .setHTML(popupHTML(store))
    .addTo(map);
}

function markerElement(store){
  const el = document.createElement('button');
  el.type='button';
  el.className='store-marker';
  el.dataset.group=store.group;
  el.dataset.region=store.region;
  el.dataset.storeNo=store.storeNo;
  el.style.setProperty('--marker-color',GROUP_COLORS[store.group]);
  el.innerHTML=`<span>${routeStop(store)}</span>`;
  el.title=`${store.name} — Store ${store.storeNo}`;
  el.setAttribute('aria-label',`${store.name}, route stop ${routeStop(store)}`);
  el.addEventListener('click', e=>{
    if(editMode && el.classList.contains('was-dragged')){
      el.classList.remove('was-dragged');
      return;
    }
    e.stopPropagation();
    openStore(store, Math.max(map.getZoom(),15));
  });
  return el;
}

function createMarkers(){
  for(const store of STORES){
    const el = markerElement(store);
    const marker = new maplibregl.Marker({
      element:el,
      anchor:'center',
      draggable:false
    }).setLngLat([store.lng,store.lat]).addTo(map);

    marker.on('dragstart',()=>{
      el.classList.add('dragging');
      el.classList.add('was-dragged');
    });
    marker.on('dragend',()=>{
      el.classList.remove('dragging');
      const ll = marker.getLngLat();
      store.lng = ll.lng;
      store.lat = ll.lat;
      saveOverride(store);
      updateRoute(store.region, true);
      setEditMessage(`Saved Store ${store.storeNo}: ${store.lat.toFixed(6)}, ${store.lng.toFixed(6)}`);
    });
    markerByStore.set(store.storeNo,marker);
  }
}

function fallbackRouteGeoJSON(region){
  const coords = (ROUTE_ORDER[region] || [])
    .map(getStore)
    .filter(Boolean)
    .map(s=>[s.lng,s.lat]);
  return {type:'Feature',properties:{road:false},geometry:{type:'LineString',coordinates:coords}};
}

async function fetchRoadRoute(region, force=false){
  const stores = (ROUTE_ORDER[region] || []).map(getStore).filter(Boolean);
  if(stores.length < 2) return fallbackRouteGeoJSON(region);

  const key = stores.map(s=>`${s.lng.toFixed(6)},${s.lat.toFixed(6)}`).join(';');
  if(!force && ROAD_ROUTE_CACHE.has(key)) return ROAD_ROUTE_CACHE.get(key);

  if(routeControllers.has(region)) routeControllers.get(region).abort();
  const controller = new AbortController();
  routeControllers.set(region,controller);

  const coordString = stores.map(s=>`${s.lng},${s.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson&steps=false`;

  try{
    const r = await fetch(url,{signal:controller.signal});
    if(!r.ok) throw new Error('routing');
    const data = await r.json();
    if(!data.routes || !data.routes[0] || !data.routes[0].geometry) throw new Error('routing');
    const feature = {
      type:'Feature',
      properties:{road:true,distance:data.routes[0].distance,duration:data.routes[0].duration},
      geometry:data.routes[0].geometry
    };
    ROAD_ROUTE_CACHE.set(key,feature);
    return feature;
  }catch(err){
    if(err && err.name === 'AbortError') throw err;
    return fallbackRouteGeoJSON(region);
  }finally{
    if(routeControllers.get(region)===controller) routeControllers.delete(region);
  }
}

async function updateRoute(region, force=false){
  const source = map.getSource(`route-${region}`);
  if(!source) return;
  source.setData(fallbackRouteGeoJSON(region));
  try{
    const road = await fetchRoadRoute(region,force);
    if(map.getSource(`route-${region}`)) map.getSource(`route-${region}`).setData(road);
  }catch(_){}
}

function refreshAllRoutes(force=false){
  for(const region of REGIONS) updateRoute(region,force);
}

function setupRoutes(){
  for(const region of REGIONS){
    map.addSource(`route-${region}`,{
      type:'geojson',
      data:fallbackRouteGeoJSON(region)
    });
    map.addLayer({
      id:`route-${region}-casing`,
      type:'line',
      source:`route-${region}`,
      layout:{'line-cap':'round','line-join':'round'},
      paint:{
        'line-color':'rgba(15,23,42,.85)',
        'line-width':['interpolate',['linear'],['zoom'],5,4,12,8,18,12],
        'line-opacity':0.72
      }
    });
    map.addLayer({
      id:`route-${region}`,
      type:'line',
      source:`route-${region}`,
      layout:{'line-cap':'round','line-join':'round'},
      paint:{
        'line-color':REGION_COLORS[region],
        'line-width':['interpolate',['linear'],['zoom'],5,2,12,4,18,6],
        'line-opacity':0.95
      }
    });
  }
  refreshAllRoutes(false);
}

function updateVisibility(){
  for(const store of STORES){
    const marker = markerByStore.get(store.storeNo);
    if(marker) marker.getElement().style.display = visibleStore(store) ? '' : 'none';
  }
  for(const region of REGIONS){
    const showRegion = activeRegion === 'All' || activeRegion === region;
    const hasVisible = (ROUTE_ORDER[region]||[]).map(getStore).some(s=>s && activeGroups.has(s.group));
    const visibility = (showRegion && hasVisible) ? 'visible' : 'none';
    if(map.getLayer(`route-${region}`)) map.setLayoutProperty(`route-${region}`,'visibility',visibility);
    if(map.getLayer(`route-${region}-casing`)) map.setLayoutProperty(`route-${region}-casing`,'visibility',visibility);
  }
  renderControls();
  renderRouteList();
}

function visibleStores(){
  return STORES.filter(visibleStore);
}

function fitVisible(animated=true){
  const list = visibleStores();
  if(!list.length) return;
  const bounds = new maplibregl.LngLatBounds();
  list.forEach(s=>bounds.extend([s.lng,s.lat]));
  map.fitBounds(bounds,{
    padding: window.innerWidth < 720 ? {top:90,bottom:90,left:45,right:45} : {top:80,bottom:70,left:70,right:70},
    maxZoom:13,
    duration:animated?650:0,
    essential:true
  });
}

function setRegion(region){
  activeRegion = region;
  updateVisibility();
  fitVisible(true);
}

function toggleGroup(group){
  if(activeGroups.has(group)){
    if(activeGroups.size===1) return;
    activeGroups.delete(group);
  }else activeGroups.add(group);
  updateVisibility();
  fitVisible(true);
}

function renderControls(){
  document.querySelectorAll('[data-region-controls]').forEach(container=>{
    container.innerHTML='';
    ['All',...REGIONS].forEach(region=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='filter-btn'+(activeRegion===region?' active':'');
      b.textContent=region;
      b.addEventListener('click',()=>setRegion(region));
      container.appendChild(b);
    });
  });

  document.querySelectorAll('[data-group-controls]').forEach(container=>{
    container.innerHTML='';
    ['Large','Standard'].forEach(group=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='group-btn'+(activeGroups.has(group)?' active':'');
      b.dataset.group=group;
      b.innerHTML=`<span class="group-dot" style="background:${GROUP_COLORS[group]}"></span>${group}`;
      b.addEventListener('click',()=>toggleGroup(group));
      container.appendChild(b);
    });
  });

  document.querySelectorAll('[data-store-count]').forEach(el=>{
    el.textContent=String(visibleStores().length);
  });
}

function renderRouteList(){
  const container=document.getElementById('routeList');
  if(!container) return;
  container.innerHTML='';
  const regions = activeRegion==='All' ? REGIONS : [activeRegion];

  for(const region of regions){
    const heading=document.createElement('div');
    heading.className='route-heading';
    heading.innerHTML=`<span style="background:${REGION_COLORS[region]}"></span>${region}`;
    container.appendChild(heading);

    for(const storeNo of (ROUTE_ORDER[region]||[])){
      const s=getStore(storeNo);
      if(!s || !activeGroups.has(s.group)) continue;
      const b=document.createElement('button');
      b.type='button';
      b.className='route-item';
      b.innerHTML=`
        <span class="route-num">${routeStop(s)}</span>
        <span class="route-copy">
          <strong>${esc(s.name)}</strong>
          <small>Store ${esc(s.storeNo)} • ${esc(s.postcode)}</small>
        </span>
        <span class="route-badge ${s.group==='Large'?'large':'standard'}">${s.group}</span>`;
      b.addEventListener('click',()=>{
        openStore(s,17);
        if(window.closeMobilePanel) window.closeMobilePanel();
      });
      container.appendChild(b);
    }
  }
}

function setEditMode(on){
  editMode=!!on;
  document.body.classList.toggle('edit-mode',editMode);
  const bar=document.getElementById('editorBar');
  if(bar) bar.classList.toggle('show',editMode);

  for(const [storeNo,marker] of markerByStore){
    marker.setDraggable(editMode);
    marker.getElement().classList.toggle('editable',editMode);
  }

  if(editMode) setEditMessage('Pin editing ON — drag a marker. Press @ again to exit.');
}

function toggleEditMode(){
  setEditMode(!editMode);
}

function installEditor(){
  window.addEventListener('keydown',e=>{
    const target=e.target;
    if(target && /INPUT|TEXTAREA|SELECT/.test(target.tagName)) return;
    if(e.key==='@'){
      e.preventDefault();
      toggleEditMode();
    }
  });

  document.getElementById('editExit')?.addEventListener('click',()=>setEditMode(false));
  document.getElementById('editExport')?.addEventListener('click',exportEdits);
  document.getElementById('editImportBtn')?.addEventListener('click',()=>document.getElementById('editImport')?.click());
  document.getElementById('editImport')?.addEventListener('change',e=>importEdits(e.target.files?.[0]));
  document.getElementById('editReset')?.addEventListener('click',resetEdits);
}

function initMap(){
  loadOverrides();

  map = new maplibregl.Map({
    container:'map',
    center:[-2.65,54.35],
    zoom:5.25,
    minZoom:4,
    maxZoom:19,
    renderWorldCopies:false,
    attributionControl:false,
    fadeDuration:110,
    style:{
      version:8,
      sources:{
        osm:{
          type:'raster',
          tiles:[
            'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
            'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
          ],
          tileSize:256,
          maxzoom:19,
          attribution:'© OpenStreetMap contributors'
        }
      },
      layers:[{
        id:'osm',
        type:'raster',
        source:'osm',
        minzoom:0,
        maxzoom:19,
        paint:{'raster-fade-duration':90}
      }]
    }
  });

  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  if(map.scrollZoom && map.scrollZoom.setWheelZoomRate) map.scrollZoom.setWheelZoomRate(1/520);
  if(map.scrollZoom && map.scrollZoom.setZoomRate) map.scrollZoom.setZoomRate(1/85);

  map.addControl(new maplibregl.NavigationControl({showCompass:false,visualizePitch:false}),'bottom-right');
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');

  map.on('load',()=>{
    setupRoutes();
    createMarkers();
    updateVisibility();
    fitVisible(false);
  });

  map.on('error',e=>{
    // Keep the interface usable even if a single tile or route request fails.
    console.debug('Map resource warning',e?.error || e);
  });

  installEditor();
}

initMap();


const panel=document.getElementById('panel');
window.closeMobilePanel=()=>panel.classList.remove('open');
document.getElementById('openPanel').addEventListener('click',()=>panel.classList.add('open'));
document.getElementById('closePanel').addEventListener('click',window.closeMobilePanel);

</script>
</body>
